name: Research playground checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: pip install poetry==2.2.1 cfn-lint
      - run: poetry install
      - run: npm --prefix frontend ci
      - run: npm --prefix frontend run format:check
      - run: poetry run pytest -q
      - run: npm --prefix frontend test
      - run: npm --prefix frontend run build
      - run: cfn-lint infra/*.yaml
      # The hosted Ubuntu image includes Chromium's runtime libraries.
      - name: Install test browser
        run: npx playwright install chromium
        working-directory: frontend
        timeout-minutes: 5
      - run: npm run test:browser
        working-directory: frontend
  lambda-image:
    if: vars.SERVERLESS_BUILD_ENABLED == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - name: Mask build identity metadata
        env:
          ROLE_ARN: ${{ secrets.SERVERLESS_BUILD_ROLE_ARN }}
          ROLE_ID: ${{ secrets.SERVERLESS_BUILD_ROLE_ID }}
        run: |
          [[ -n "$ROLE_ARN" && -n "$ROLE_ID" ]] || { echo 'Configure the build role ARN and role ID secrets.' >&2; exit 1; }
          printf '::add-mask::%s\n' "${ROLE_ARN##*/}" "$ROLE_ID"
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.SERVERLESS_BUILD_ROLE_ARN }}
          aws-region: us-east-1
          mask-aws-account-id: true
      - name: Verify build AWS account
        env:
          EXPECTED_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
        run: |
          actual_account=$(aws sts get-caller-identity --query Account --output text)
          [[ "$actual_account" == "$EXPECTED_ACCOUNT_ID" ]] || { echo 'AWS account does not match the configured account.' >&2; exit 1; }
      - name: Authenticate the public adapter image pull
        run: aws ecr-public get-login-password --region us-east-1 | docker login --username AWS --password-stdin public.ecr.aws
      - name: Build the deployment image
        run: |
          set -o pipefail
          for attempt in 1 2 3; do
            if docker build --platform linux/amd64 --tag utm-ipd-lambda:check --file Dockerfile.lambda . 2>&1 | tee "$RUNNER_TEMP/lambda-image-build.log"; then
              exit 0
            fi
            grep -qiE '429|too many requests' "$RUNNER_TEMP/lambda-image-build.log" || exit 1
            [[ "$attempt" == 3 ]] && exit 1
            sleep 10
          done
      - name: Verify packaged simulations and streamed responses
        run: bash scripts/check_lambda_image.sh utm-ipd-lambda:check "$GITHUB_SHA"
