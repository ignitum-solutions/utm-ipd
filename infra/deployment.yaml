AWSTemplateFormatVersion: '2010-09-09'
Description: Build artifacts and repository-scoped OIDC role for the serverless application
Parameters:
  AppStackName:
    Type: String
    Default: utm-ipd-serverless
    AllowedPattern: '[a-z][a-z0-9-]{0,29}'
  GitHubRepository:
    Type: String
    Default: ignitum-solutions/utm-ipd
  DeploymentBranch:
    Type: String
    Default: main
Resources:
  Artifacts:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      VersioningConfiguration:
        Status: Enabled
  ArtifactPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref Artifacts
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Deny
            Principal: '*'
            Action: s3:*
            Resource: [!GetAtt Artifacts.Arn, !Sub '${Artifacts.Arn}/*']
            Condition:
              Bool:
                aws:SecureTransport: false
  Images:
    Type: AWS::ECR::Repository
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      ImageScanningConfiguration:
        ScanOnPush: true
      LifecyclePolicy:
        LifecyclePolicyText: '{"rules":[{"rulePriority":1,"description":"Retain the latest 30 deployment images","selection":{"tagStatus":"any","countType":"imageCountMoreThan","countNumber":30},"action":{"type":"expire"}}]}'
  DeployRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Federated: !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:oidc-provider/token.actions.githubusercontent.com'
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
                token.actions.githubusercontent.com:sub: !Sub 'repo:${GitHubRepository}:ref:refs/heads/${DeploymentBranch}'
      Policies:
        - PolicyName: ApplicationDeployment
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: cloudformation:*
                Resource:
                  - !Sub 'arn:${AWS::Partition}:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/${AppStackName}/*'
                  - !Sub 'arn:${AWS::Partition}:cloudformation:${AWS::Region}:${AWS::AccountId}:changeSet/samcli-deploy*/*'
                  - !Sub 'arn:${AWS::Partition}:cloudformation:${AWS::Region}:aws:transform/Serverless-2016-10-31'
              - Effect: Allow
                Action: [cloudformation:DescribeStacks, cloudformation:ListStackResources]
                Resource: !Ref AWS::StackId
              - Effect: Allow
                Action: [cloudformation:ValidateTemplate, cloudformation:GetTemplateSummary]
                Resource: '*'
              - Effect: Allow
                Action: s3:*
                Resource:
                  - !GetAtt Artifacts.Arn
                  - !Sub '${Artifacts.Arn}/*'
                  - !Sub 'arn:${AWS::Partition}:s3:::${AppStackName}-sitebucket-*'
              - Effect: Allow
                Action: ecr:GetAuthorizationToken
                Resource: '*'
              - Effect: Allow
                Action: [ecr:BatchCheckLayerAvailability, ecr:GetDownloadUrlForLayer, ecr:BatchGetImage, ecr:InitiateLayerUpload, ecr:UploadLayerPart, ecr:CompleteLayerUpload, ecr:PutImage, ecr:DescribeImages, ecr:DescribeRepositories]
                Resource: !GetAtt Images.Arn
              - Effect: Allow
                Action: [lambda:CreateFunction, lambda:GetFunction, lambda:GetFunctionConfiguration, lambda:UpdateFunctionCode, lambda:UpdateFunctionConfiguration, lambda:DeleteFunction, lambda:GetPolicy, lambda:AddPermission, lambda:RemovePermission, lambda:CreateFunctionUrlConfig, lambda:GetFunctionUrlConfig, lambda:UpdateFunctionUrlConfig, lambda:DeleteFunctionUrlConfig, lambda:PutFunctionConcurrency, lambda:GetFunctionConcurrency, lambda:DeleteFunctionConcurrency, lambda:TagResource, lambda:UntagResource, lambda:ListTags]
                Resource: !Sub 'arn:${AWS::Partition}:lambda:${AWS::Region}:${AWS::AccountId}:function:${AppStackName}-Simulation-*'
              - Effect: Allow
                Action: [iam:CreateRole, iam:DeleteRole, iam:GetRole, iam:UpdateAssumeRolePolicy, iam:PutRolePolicy, iam:DeleteRolePolicy, iam:GetRolePolicy, iam:ListRolePolicies, iam:ListAttachedRolePolicies, iam:TagRole, iam:UntagRole]
                Resource: !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:role/${AppStackName}-SimulationRole-*'
              - Effect: Allow
                Action: [iam:AttachRolePolicy, iam:DetachRolePolicy]
                Resource: !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:role/${AppStackName}-SimulationRole-*'
                Condition:
                  ArnEquals:
                    iam:PolicyARN: !Sub 'arn:${AWS::Partition}:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole'
              - Effect: Allow
                Action: iam:PassRole
                Resource: !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:role/${AppStackName}-SimulationRole-*'
                Condition:
                  StringEquals:
                    iam:PassedToService: lambda.amazonaws.com
              - Effect: Allow
                Action: [logs:CreateLogGroup, logs:DeleteLogGroup, logs:PutRetentionPolicy, logs:DeleteRetentionPolicy, logs:DescribeLogStreams, logs:TagResource, logs:UntagResource, logs:ListTagsForResource]
                Resource: !Sub 'arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/${AppStackName}-Simulation-*'
              - Effect: Allow
                Action: logs:DescribeLogGroups
                Resource: '*'
              # Distribution creation uses request tags; updates use existing tags.
              - Effect: Allow
                Action: [cloudfront:CreateDistribution, cloudfront:TagResource]
                Resource: '*'
                Condition:
                  StringEquals:
                    aws:RequestTag/Application: !Ref AppStackName
              - Effect: Allow
                Action: [cloudfront:GetDistribution, cloudfront:GetDistributionConfig, cloudfront:UpdateDistribution, cloudfront:DeleteDistribution, cloudfront:CreateInvalidation, cloudfront:GetInvalidation, cloudfront:UntagResource]
                Resource: !Sub 'arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:distribution/*'
                Condition:
                  StringEquals:
                    aws:ResourceTag/Application: !Ref AppStackName
              - Effect: Allow
                Action: cloudfront:ListTagsForResource
                Resource: !Sub 'arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:distribution/*'
              # OAC APIs do not support resource-level IAM permissions.
              - Effect: Allow
                Action: [cloudfront:CreateOriginAccessControl, cloudfront:GetOriginAccessControl, cloudfront:GetOriginAccessControlConfig, cloudfront:UpdateOriginAccessControl, cloudfront:DeleteOriginAccessControl]
                Resource: '*'
Outputs:
  DeployRoleArn:
    Value: !GetAtt DeployRole.Arn
  ArtifactBucket:
    Value: !Ref Artifacts
  ImageRepository:
    Value: !GetAtt Images.RepositoryUri
